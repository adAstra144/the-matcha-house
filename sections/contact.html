<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ------------------ Basic SEO ------------------ -->
    <title>Contact The Matcha House | Social Media & Email</title>

    <meta
        name="description"
        content="Connect with The Matcha House on Facebook, Instagram, and TikTok, or contact the café by email."
    >

    <link
        rel="canonical"
        href="https://thematchahouse.vercel.app/contact"
    >

    <!-- ---------- Open Graph: Link Previews ---------- -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="The Matcha House">

    <meta
        property="og:title"
        content="Contact The Matcha House | Social Media & Email"
    >

    <meta
        property="og:description"
        content="Connect with The Matcha House on Facebook, Instagram, and TikTok, or contact the café by email."
    >

    <meta
        property="og:url"
        content="https://thematchahouse.vercel.app/contact"
    >

    <meta
        property="og:image"
        content="https://thematchahouse.vercel.app/og-matcha-house.jpg"
    >

    <meta
        property="og:image:alt"
        content="The Matcha House café and its matcha drinks and coffee"
    >

    <!-- ---------- X / Twitter ---------- -->
    <meta name="twitter:card" content="summary_large_image">

    <!-- ----------------- Icon ------------------ -->
    <link rel="icon" type="image/png" href="/favicon.png">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="/src/reset.css">
    <link rel="stylesheet" href="/src/style.css">
    <link rel="stylesheet" href="/src/contact.css">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">

    <!-- JS -->
    <script type="module" src="/src/script.js"></script>
</head>
<body>

    <header>
        <a href="/" class="brand">
            <img src="/src/assets/brand.jpg" alt="TMH Logo">
            <h1>The Matcha House</h1>
        </a>

        <button class="burger" aria-label="Toggle menu" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav id="site-nav">
            <a href="/"><span>Home</span></a>
            <a href="/menu"><span>Menu</span></a>
            <a href="/location"><span>Location</span></a>
            <a href="/contact" aria-current="page"><span>Contact</span></a>
            <a href="/membership"><span>Membership</span></a>
        </nav>
    </header>

    <main>
        <section class="contact">
            <div class="contact-inner">

                <div class="contact-info">
                    <h1>Let's get in touch</h1>

                    <dl class="contact-list">
                        <div>
                            <dt><img src="/src/assets/icons/facebook.svg" alt="">Facebook</dt>
                            <dd><a href="https://www.facebook.com/profile.php?id=61575086252716" target="_blank" rel="noopener">The Matcha House</a></dd>
                        </div>
                        <div>
                            <dt><img src="/src/assets/icons/instagram.png" alt="">Instagram</dt>
                            <dd><a href="https://www.instagram.com/thematchahouse.ph" target="_blank" rel="noopener">@thematchahouse.ph</a></dd>
                        </div>
                        <div>
                            <dt><img src="/src/assets/icons/tiktok.png" alt="">TikTok</dt>
                            <dd><a href="https://www.tiktok.com/@thematchahouse.ph" target="_blank" rel="noopener">@thematchahouse.ph</a></dd>
                        </div>
                        <div>
                            <dt><img src="/src/assets/icons/email.png" alt="">Email</dt>
                            <dd><a href="mailto:thematchahousejph@gmail.com">thematchahousejph@gmail.com</a></dd>
                        </div>
                    </dl>

                    <div class="contact-actions">
                        <a class="btn-primary" href="mailto:thematchahousejph@gmail.com">Send an email</a>
                    </div>
                </div>

                <!-- Elfsight Instagram Feed | Untitled Instagram Feed -->
                <section class="ig-widget">
                    <script src="https://elfsightcdn.com/platform.js" async></script>
                    <div class="elfsight-app-18e570a6-4498-40ea-a310-0c141a2745e1" data-elfsight-app-lazy></div>
                </section>

            </div>
        </section>
    </main>

</body>
</html>
