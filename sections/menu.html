<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ------------------ Basic SEO ------------------ -->
    <title>Menu & Prices | The Matcha House</title>

    <meta
        name="description"
        content="Explore The Matcha House menu, featuring matcha lattes, signature coffee, cloud drinks, Vietnamese-inspired favorites, pasta, and comfort food."
    >

    <link
        rel="canonical"
        href="https://thematchahouse.vercel.app/menu"
    >

    <!-- ---------- Open Graph: Link Previews ---------- -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="The Matcha House">

    <meta
        property="og:title"
        content="Menu & Prices | The Matcha House"
    >

    <meta
        property="og:description"
        content="Explore The Matcha House menu, featuring matcha lattes, signature coffee, cloud drinks, Vietnamese-inspired favorites, pasta, and comfort food."
    >

    <meta
        property="og:url"
        content="https://thematchahouse.vercel.app/menu"
    >

    <meta
        property="og:image"
        content="https://thematchahouse.vercel.app/og-matcha-house.jpg"
    >

    <meta
        property="og:image:alt"
        content="The Matcha House café and its matcha drinks and coffee"
    >

    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="en_PH">

    <!-- ---------- X / Twitter ---------- -->
    <meta name="twitter:card" content="summary_large_image">

    <!-- ----------------- Icon ------------------ -->
    <link rel="icon" type="image/png" href="/favicon.png">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="/src/reset.css">
    <link rel="stylesheet" href="/src/style.css">
    <link rel="stylesheet" href="/src/menu.css">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">

    <!-- JS -->
    <script type="module" src="/src/script.js"></script>
    <script type="module" src="/src/menu.js"></script>
</head>
<body>

    <header>
        <a href="/" class="brand">
            <img src="/src/assets/brand.jpg" alt="TMH Logo">
            <h1>The Matcha House</h1>
        </a>

        <button class="burger" aria-label="Toggle menu" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav id="site-nav">
            <a href="/"><span>Home</span></a>
            <a href="/menu" aria-current="page"><span>Menu</span></a>
            <a href="/location"><span>Location</span></a>
            <a href="/contact"><span>Contact</span></a>
            <a href="/membership"><span>Membership</span></a>
        </nav>
    </header>

    <main>

        <section class="menu">
            <h1 class="menu-title">Explore our items</h1>
            
            <div class="menu-layout">
                <button type="button" class="sidebar-toggle" aria-expanded="false" aria-controls="menu-sidebar">
                    <span aria-hidden="true">☰</span> Categories
                </button>

                <!-- Filled by menu.js from the categories data -->
                <nav class="menu-sidebar" id="menu-sidebar" aria-label="Menu categories">
                    <ul class="sidebar-list"></ul>
                </nav>

                <!-- Filled by menu.js from the categories data -->
                <div class="menu-content"></div>
            </div>
        </section>

    </main>

    <div class="sidebar-backdrop"></div>

    <!-- Item Popup Modal -->
    <dialog class="item-modal" aria-labelledby="modal-name">
        <button type="button" class="modal-close" aria-label="Close item details">&times;</button>
        <div class="modal-content">
            <img class="modal-image" src="" alt="">
            <div class="modal-details">
                <h2 id="modal-name"></h2>
                <div class="modal-prices"></div>
                <div class="modal-sizes" role="radiogroup" aria-label="Size"></div>
                <p class="modal-description"></p>
                <div class="modal-actions">
                    <div class="modal-qty" role="group" aria-label="Quantity">
                        <button type="button" class="qty-btn" data-action="dec" aria-label="Decrease quantity">−</button>
                        <span class="qty-value" aria-live="polite">1</span>
                        <button type="button" class="qty-btn" data-action="inc" aria-label="Increase quantity">+</button>
                    </div>
                    <button type="button" class="btn-primary modal-add">Add to Cart</button>
                </div>
            </div>
        </div>
    </dialog>

</body>
</html>
