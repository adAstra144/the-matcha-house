<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Menu</title>
    <link rel="icon" type="image/png" href="/favicon.png">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="/src/reset.css">
    <link rel="stylesheet" href="/src/style.css">
    <link rel="stylesheet" href="/src/menu.css">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <a href="/" class="brand">
            <h1>The Matcha House</h1>
        </a>

        <nav>
            <a href="/">
                <span>Home</span>
            </a>

            <a href="/menu">
                <span>Menu</span>
            </a>

            <a href="/location">
                <span>Location</span>
            </a>

            <a href="/contact">
                <span>Contact</span>
            </a>
        </nav>

        <section class="intro">
            <h1>Explore our items</h1>
        </section>

        <section class="menu">

            <h1>Macha Series Drinks</h1>
            <div class="item-container">

                <button type="button" data-item="dirty-matcha-latte" class="item" aria-label="View Dirty Matcha Latte details">
                    <img src="/src/assets/items/matcha/dirty-matcha-latte.png" alt="Dirty Matcha Latte">
                    <span>Dirty Matcha Latte</span>
                </button>

                <button type="button" data-item="earthday-matcha" class="item" aria-label="View Earthday Matcha details">
                    <img src="/src/assets/items/matcha/earthday-matcha.png" alt="Earthday Matcha">

                </button>

                <button type="button" data-item="egg-matcha" class="item" aria-label="View Egg Matcha details">
                    <img src="/src/assets/items/matcha/egg-matcha.png" alt="Egg Matcha">
                    <span>Egg Matcha</span>
                </button>

                <button type="button" data-item="iced-matcha-coco" class="item" aria-label="View Iced Matcha Coco details">
                    <img src="/src/assets/items/matcha/iced-matcha-coco.png" alt="Iced Matcha Coco">
                    <span>Iced Matcha Coco</span>
                </button>

                <button type="button" data-item="london-fog-matcha" class="item" aria-label="View London Fog Matcha details">
                    <img src="/src/assets/items/matcha/london-fog-matcha.png" alt="London Fog Matcha">
                    <span>London Fog Matcha</span>
                </button>

                <button type="button" data-item="matcha-latte" class="item" aria-label="View Matcha Latte details">
                    <img src="/src/assets/items/matcha/matcha-latte.png" alt="Matcha Latte">
                    <span>Matcha Latte</span>
                </button>

                <button type="button" data-item="matcha-lemonade" class="item" aria-label="View Matcha Lemonade details">
                    <img src="/src/assets/items/matcha/matcha-lemonade.png" alt="Matcha Lemonade">
                    <span>Matchaa Lemonade</span>
                </button>

                <button type="button" data-item="usucha" class="item" aria-label="View Usucha details">
                    <img src="/src/assets/items/matcha/usucha.png" alt="Usucha">
                    <span>Usucha</span>

                <button type="button" data-item="baristas-drink" class="item" aria-label="View Barista's Drink details">

                <button type="button" data-item="banana-latte" class="item" aria-label="View Banana Latte details">

                    <img src="/src/assets/items/coffee/iced-mocha.png" alt="Iced Mocha">

                <button type="button" data-item="iced-salted-coffee" class="item" aria-label="View Iced Salted Coffee details">
                    <img src="/src/assets/items/coffee/iced-salted-coffee.png" alt="Iced Salted Coffee">

                <button type="button" data-item="iced-americano" class="item" aria-label="View Iced Americano details">

                <button type="button" data-item="strawberry-matcha-latte" class="item" aria-label="View Strawberry Matcha Latte details">

                </button>

            </div>

            <h1>Cloud Series</h1>
            <div class="item-container">

                <button type="button" data-item="chocolate-coconut-cloud" class="item" aria-label="View Chocolate Coconut Cloud details">
                    <img src="/src/assets/items/cloud-series/chocolate-coconut-cloud.png" alt="Chocolate Coconut Cloud">

                <button type="button" data-item="cloud-coconut-matcha-cloud" class="item" aria-label="View Coconut Matcha Cloud details">

                <button type="button" data-item="espresso-coconut-cloud" class="item" aria-label="View Espresso Coconut Cloud details">

                </button>

                <button type="button" data-item="espresso-cold-foam" class="item" aria-label="View Espresso Cold Foam details">
                    <img src="/src/assets/items/cloud-series/espresso-cold-foam.png" alt="Espresso Cold Foam">
                    <span>Espresso Cold Foam</span>
                </button>

                <button type="button" data-item="hojicha-coconut-cloud" class="item" aria-label="View Hojicha Coconut Cloud details">

                <button type="button" data-item="jasmine-matcha-cloud" class="item" aria-label="View Jasmine Matcha Cloud details">

                <button type="button" data-item="strawberry-matcha-coconut-cloud" class="item" aria-label="View Strawberry Matcha Coconut Cloud details">

                </button>

            </div>

        </section>

    </main>

    <!-- Item Popup Modal -->
    <dialog class="item-modal" aria-labelledby="modal-name">
        <button type="button" class="modal-close" aria-label="Close item details">&times;</button>
        <div class="modal-content">
            <img class="modal-image" src="" alt="">
            <div class="modal-details">
                <h2 id="modal-name"></h2>
                <div class="modal-prices"></div>
                <p class="modal-description"></p>
            </div>
        </div>
    </dialog>

    <script type="module" src="/src/menu.js"></script>
</body>
</html>
